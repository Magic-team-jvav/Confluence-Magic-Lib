modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory=true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# MagicLib 的注册、网络、组件、附件与平台事件契约都直接建立在 PortLib 上。
[[dependencies.${ mod_id }]]
modId = "portlib"
mandatory = true
versionRange = "[${portlib_version},)"
ordering = "AFTER"
side = "BOTH"
